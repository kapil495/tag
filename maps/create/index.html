<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Table & Image Upload</title>
<link rel="stylesheet" href="/maps/create/index.css">
</head>
<body>

<div class="container">
    <!-- Table with input fields for rows and columns -->
    <div class="slider-container">
        <label for="rows">Rows:</label>
        <input type="range" id="rows" min="1" max="10" value="3">
        <span id="rowsValue">3</span>

        <label for="cols">Columns:</label>
        <input type="range" id="cols" min="1" max="10" value="3">
        <span id="colsValue">3</span>
    </div>

    <table id="dynamicTable"></table>

    <!-- Image Drag and Drop Section -->
    <div class="drag-drop-container" ondrop="drop(event)" ondragover="allowDrop(event)">
        <p>Drag and drop images here:</p>
        <div class="image-preview" id="imagePreview"></div>
    </div>

    <button onclick="uploadImages()">Upload Images</button>
    <pre id="imageDataOutput"></pre>
</div>
<script src="/maps/create/index.js"></script>

</body>
</html>
