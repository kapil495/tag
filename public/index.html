<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Loader</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="mainBox">
        <div class="joinRoomText hide">Joining The Room</div>
        <div class="makeRoomText hide">Creating The Room</div>
        <div class="joinRoom">
            Join Room
        </div>
        <div class="makeRoom">
            Create Room
        </div>
        <div class="shiftToMakeRoom hide">Wanna Create Room </div>
        <div class="shiftToJoinRoom hide">Wanna Join Room </div>
        <div class="joinRoomForm hide">
            <input type="text" name="PlayerName" class="joinRoomInput" id="PlayerName" placeholder="Player Name">
            <input type="text" name="joinRoomId" class="joinRoomInput" id="joinRoomId" placeholder="Room id">
        </div>
        <div class="makeRoomForm hide">
            <input type="text" name="PlayerName" class="makeRoomInput" id="PlayerName" placeholder="Player Name">
            <input type="text" name="makeRoomName" class="makeRoomInput" id="makeRoomName" placeholder="Room Name">
        </div>
    </div>
    <script src="./index.js" type="module"></script>
</body>
</html>
