<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Room Management</h1>
        <div id="options">
            <button id="makeRoomBtn">Make Room</button>
            <button id="joinRoomBtn">Join Room</button>
        </div>
        <div id="makeRoom" class="hidden">
            <h2>Make Room</h2>
            <button id="sendToServer">Send Request to Server</button>
        </div>
        <div id="joinRoom" class="hidden">
            <h2>Join Room</h2>
            <label for="roomCode">Enter Room Code:</label>
            <input type="text" id="roomCode" maxlength="11" pattern="" placeholder="kuP0i1FM5l">
            <button id="joinRoomSubmit">Submit</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
